name: enca-windows

on:
  push:
    paths:
      - 'src/enca/**'
      - 'test/enca/**'
      - '.github/workflows/enca-*.yml'
  pull_request:
    paths:
      - 'src/enca/**'
      - 'test/enca/**'
  workflow_dispatch:

jobs:
  msys2-gcc-functional:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          update: false
          install: make mingw-w64-x86_64-gcc
      - name: Functional suite (gcc-check)
        working-directory: test/enca
        run: make gcc-check

  msys2-gcc-asan:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          update: false
          install: make mingw-w64-x86_64-gcc
      - name: ASan suite (gcc)
        working-directory: test/enca
        run: make CC=gcc asan
