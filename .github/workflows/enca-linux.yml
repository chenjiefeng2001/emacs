name: enca-linux

on:
  push:
    paths:
      - 'src/enca/**'
      - 'test/enca/**'
      - 'src/enca-emacs.c'
      - 'configure.ac'
      - 'src/Makefile.in'
      - '.github/workflows/enca-*.yml'
  pull_request:
    paths:
      - 'src/enca/**'
      - 'test/enca/**'
      - 'src/enca-emacs.c'
      - 'configure.ac'
      - 'src/Makefile.in'
  workflow_dispatch:

env:
  ENCA_SRC: >-
    src/enca/diagnostics/error.c
    src/enca/id/id.c
    src/enca/memory/allocator.c
    src/enca/memory/arena.c
    src/enca/memory/slab.c
    src/enca/time/clock.c
    src/enca/thread/thread.c
    src/enca/event/event.c
    src/enca/event/dispatch.c
    src/enca/queue/spsc_ring.c
    src/enca/queue/blocking_queue.c
    src/enca/cancel/cancel.c
    src/enca/trace/trace.c
    src/enca/trace/profiler.c
    src/enca/runtime/runtime.c
  ENCA_TEST: >-
    test/enca/main.c
    test/enca/test_base.c
    test/enca/test_id.c
    test/enca/test_memory.c
    test/enca/test_arena.c
    test/enca/test_slab.c
    test/enca/test_time.c
    test/enca/test_thread.c
    test/enca/test_queue.c
    test/enca/test_event.c
    test/enca/test_cancel.c
    test/enca/test_cancel_race.c
    test/enca/test_trace_perf.c
    test/enca/test_runtime.c

jobs:
  functional-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build (gcc -O0 -Werror)
        run: |
          gcc --version | head -n1
          gcc -std=gnu11 -O0 -g -Wall -Wextra -Werror \
            ${{ env.ENCA_SRC }} ${{ env.ENCA_TEST }} -o enca_tests_dbg
      - name: Run (gdb-wrapped, backtrace on crash)
        run: |
          sudo apt-get install -y gdb >/dev/null
          set +e
          gdb -q -batch -return-child-result -ex run \
            -ex "thread apply all bt 12" --args ./enca_tests_dbg > run_dbg.log 2>&1
          rc=$?
          echo "child_exit=$rc" >> run_dbg.log
          grep -m 5 "FAIL" run_dbg.log | sed 's/^/::error::/' || true
          tail -n 8 run_dbg.log
          exit "$rc"
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enca-linux-debug-log
          path: run_dbg.log

  functional-opt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build (gcc -O2)
        run: >
          gcc -std=gnu11 -O2 -g -Wall -Wextra -Werror
          ${{ env.ENCA_SRC }} ${{ env.ENCA_TEST }} -o enca_tests_opt
      - name: Run (gdb-wrapped, backtrace on crash)
        run: |
          sudo apt-get install -y gdb >/dev/null
          set +e
          gdb -q -batch -return-child-result -ex run \
            -ex "thread apply all bt 12" --args ./enca_tests_opt > run_opt.log 2>&1
          rc=$?
          echo "child_exit=$rc" >> run_opt.log
          grep -m 5 "FAIL" run_opt.log | sed 's/^/::error::/' || true
          tail -n 8 run_opt.log
          exit "$rc"
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enca-linux-opt-log
          path: run_opt.log

  asan-lsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@v4
      - name: Build (ASan)
        run: >
          gcc -std=gnu11 -O1 -g -fsanitize=address -fno-omit-frame-pointer
          ${{ env.ENCA_SRC }} ${{ env.ENCA_TEST }} -o enca_tests_asan
      - name: Run (ASan + LSan)
        run: ./enca_tests_asan

  ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build (UBSan, halt on error)
        run: >
          gcc -std=gnu11 -O1 -g -fsanitize=undefined
          -fno-sanitize-recover=all -fno-omit-frame-pointer
          -DENCA_TEST_UBSAN=1
          ${{ env.ENCA_SRC }} ${{ env.ENCA_TEST }} -o enca_tests_ubsan
      - name: Run
        run: ./enca_tests_ubsan

  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build (TSan)
        run: >
          gcc -std=gnu11 -O1 -g -fsanitize=thread -fno-omit-frame-pointer
          ${{ env.ENCA_SRC }} ${{ env.ENCA_TEST }} -o enca_tests_tsan
      - name: Run
        run: ./enca_tests_tsan

  emacs-build:
    ## P1.11 gate: full Emacs links with --enable-enca and the minimal
    ## embedding passes a batch vertical slice (submit -> worker ->
    ## pump -> handler -> shutdown).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends \
            autoconf automake pkg-config texinfo libncurses-dev >/dev/null
      - name: autogen + configure (--enable-enca, headless)
        run: |
          ./autogen.sh
          ./configure --enable-enca --without-x --without-all \
            --disable-build-details CFLAGS='-O1 -g'
          grep -E '^#define HAVE_ENCA' src/config.h
      - name: Build temacs + emacs
        run: make -j"$(nproc)"
      - name: Smoke test (batch vertical slice)
        run: |
          set -e
          ./src/emacs --batch --eval '
            (progn
              (unless (eq (enca-available-p) t)
                (error "enca not available"))
              (let* ((results nil)
                     (handler (lambda (_src seq gen val)
                                (push (list seq gen val) results))))
                (enca-set-handler handler)
                ;; Phase 1: small tasks, wait for all results.
                (dotimes (_i 8) (enca-submit "hello enca"))
                (let ((deadline (+ (float-time) 10.0)))
                  (while (and (< (length results) 8)
                              (< (float-time) deadline))
                    (sleep-for 0.05)
                    (enca-poll))
                  (unless (= (length results) 8)
                    (error "vertical slice incomplete: %d" (length results)))
                  (let ((vals (mapcar (lambda (r) (nth 2 r)) results)))
                    (unless (apply (function =) vals)
                      (error "hash mismatch across workers: %S" vals))))
                (message "phase1 ok: %S" (car results))
                ;; Phase 2: in-flight batch then cancel; every pre-cancel
                ;; task must land in exactly one of {stale, cancelled}.
                (dotimes (_i 16) (enca-submit (make-string 200000 ?x)))
                (enca-cancel)
                (sleep-for 0.5)
                (enca-poll 256)
                (let ((st (enca-status)))
                  (message "post-cancel status: %S" st)
                  (unless (= (aref st 3) 8)
                    (error "committed drifted: %s (want 8)" (aref st 3)))
                  (unless (= (+ (aref st 4) (aref st 5)) 16)
                    (error "pre-cancel tasks not accounted: stale=%s cancelled=%s"
                           (aref st 4) (aref st 5))))
                ;; Phase 3: fresh generation accepts new work.
                (enca-submit "fresh work")
                (sleep-for 0.3)
                (enca-poll 64)
                (unless (= (aref (enca-status) 3) 9)
                  (error "post-cancel commit missing"))
                (enca-shutdown)
                (princ "ENCA_E2E_OK\n" (function external-debugging-output))))'
