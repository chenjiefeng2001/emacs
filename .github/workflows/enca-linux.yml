name: enca-linux

on:
  push:
    paths:
      - 'src/enca/**'
      - 'test/enca/**'
      - '.github/workflows/enca-*.yml'
  pull_request:
    paths:
      - 'src/enca/**'
      - 'test/enca/**'
  workflow_dispatch:

env:
  ENCA_SRC: >-
    src/enca/diagnostics/error.c
    src/enca/id/id.c
    src/enca/memory/allocator.c
    src/enca/memory/arena.c
    src/enca/memory/slab.c
    src/enca/time/clock.c
    src/enca/thread/thread.c
    src/enca/event/event.c
    src/enca/event/dispatch.c
    src/enca/queue/spsc_ring.c
    src/enca/queue/blocking_queue.c
    src/enca/cancel/cancel.c
    src/enca/trace/trace.c
    src/enca/trace/profiler.c
    src/enca/runtime/runtime.c
  ENCA_TEST: >-
    test/enca/main.c
    test/enca/test_base.c
    test/enca/test_id.c
    test/enca/test_memory.c
    test/enca/test_arena.c
    test/enca/test_slab.c
    test/enca/test_time.c
    test/enca/test_thread.c
    test/enca/test_queue.c
    test/enca/test_event.c
    test/enca/test_cancel.c
    test/enca/test_cancel_race.c
    test/enca/test_trace_perf.c
    test/enca/test_runtime.c

jobs:
  functional-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build (gcc -O0 -Werror)
        run: |
          gcc --version | head -n1
          gcc -std=gnu11 -O0 -g -Wall -Wextra -Werror \
            ${{ env.ENCA_SRC }} ${{ env.ENCA_TEST }} -o enca_tests_dbg
      - name: Run (gdb-wrapped, backtrace on crash)
        run: |
          sudo apt-get install -y gdb >/dev/null
          set +e
          gdb -q -batch -return-child-result -ex run \
            -ex "thread apply all bt 12" --args ./enca_tests_dbg > run_dbg.log 2>&1
          rc=$?
          echo "child_exit=$rc" >> run_dbg.log
          grep -m 5 "FAIL" run_dbg.log | sed 's/^/::error::/' || true
          tail -n 8 run_dbg.log
          exit "$rc"
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enca-linux-debug-log
          path: run_dbg.log

  functional-opt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build (gcc -O2)
        run: >
          gcc -std=gnu11 -O2 -g -Wall -Wextra -Werror
          ${{ env.ENCA_SRC }} ${{ env.ENCA_TEST }} -o enca_tests_opt
      - name: Run (gdb-wrapped, backtrace on crash)
        run: |
          sudo apt-get install -y gdb >/dev/null
          set +e
          gdb -q -batch -return-child-result -ex run \
            -ex "thread apply all bt 12" --args ./enca_tests_opt > run_opt.log 2>&1
          rc=$?
          echo "child_exit=$rc" >> run_opt.log
          grep -m 5 "FAIL" run_opt.log | sed 's/^/::error::/' || true
          tail -n 8 run_opt.log
          exit "$rc"
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enca-linux-opt-log
          path: run_opt.log

  asan-lsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@v4
      - name: Build (ASan)
        run: >
          gcc -std=gnu11 -O1 -g -fsanitize=address -fno-omit-frame-pointer
          ${{ env.ENCA_SRC }} ${{ env.ENCA_TEST }} -o enca_tests_asan
      - name: Run (ASan + LSan)
        run: ./enca_tests_asan

  ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build (UBSan, halt on error)
        run: >
          gcc -std=gnu11 -O1 -g -fsanitize=undefined
          -fno-sanitize-recover=all -fno-omit-frame-pointer
          -DENCA_TEST_UBSAN=1
          ${{ env.ENCA_SRC }} ${{ env.ENCA_TEST }} -o enca_tests_ubsan
      - name: Run
        run: ./enca_tests_ubsan

  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build (TSan)
        run: >
          gcc -std=gnu11 -O1 -g -fsanitize=thread -fno-omit-frame-pointer
          ${{ env.ENCA_SRC }} ${{ env.ENCA_TEST }} -o enca_tests_tsan
      - name: Run
        run: ./enca_tests_tsan
